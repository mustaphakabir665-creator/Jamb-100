<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAMB 100% — Student Portal</title>
<style>
:root{--p:#075e54;--p2:#0b806f;--bg:#f4f7f7;--card:#fff;--text:#172321;--muted:#6d7a78;--line:#e2e9e7;--gold:#f0b429;--danger:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.top{height:68px;background:linear-gradient(135deg,var(--p),#063f3a);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:10}
.brand{font-weight:900;font-size:23px}.brand span{color:#ffe08a}.user{display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center;font-weight:800}
.layout{display:flex;min-height:calc(100vh - 68px)}aside{width:250px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:68px;height:calc(100vh - 68px)}
.nav{display:grid;gap:6px}.nav button{padding:13px 15px;border-radius:11px;background:transparent;text-align:left;color:#40514e}.nav button.active,.nav button:hover{background:#e8f5f2;color:var(--p);font-weight:700}
main{flex:1;padding:28px;max-width:1300px}.hero{background:linear-gradient(135deg,#075e54,#0b806f);border-radius:20px;color:#fff;padding:28px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:#d8efeb}.hero .mark{font-size:64px;font-weight:900;opacity:.18}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 16px #153c3510}.card h3{margin:0 0 8px}.muted{color:var(--muted)}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf5f3;color:var(--p);font-size:12px;font-weight:700}.price{font-size:23px;font-weight:900;margin:12px 0}.primary{background:var(--p);color:#fff;padding:11px 16px;border-radius:10px;font-weight:700}.secondary{background:#edf5f3;color:var(--p);padding:11px 16px;border-radius:10px;font-weight:700}.danger{background:#fee;color:var(--danger);padding:11px 16px;border-radius:10px}.section{display:none}.section.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{font-size:26px}.form-wrap{max-width:720px;margin:30px auto}.form-card{background:#fff;padding:30px;border-radius:20px;border:1px solid var(--line);box-shadow:0 8px 30px #153c3510}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select{padding:13px;border:1px solid #ccd8d5;border-radius:10px;outline:0}.field input:focus,.field select:focus{border-color:var(--p)}.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.auth-left{background:linear-gradient(145deg,#06483f,#0b806f);color:#fff;padding:8%;display:flex;flex-direction:column;justify-content:center}.auth-left h1{font-size:48px;margin:0 0 15px}.auth-left p{font-size:18px;line-height:1.7;color:#d8efeb}.auth-right{display:grid;place-items:center;padding:30px;background:#f7faf9}.auth-card{width:min(520px,100%);background:#fff;padding:34px;border-radius:20px;border:1px solid var(--line)}.switch{text-align:center;margin-top:18px}.link{color:var(--p);font-weight:800;cursor:pointer}.notice{padding:14px;border-radius:12px;background:#fff8df;border:1px solid #f4d67a}.success{background:#e9f8ef;border:1px solid #a8dfbb;padding:14px;border-radius:12px}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tabs button{white-space:nowrap;background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:10px}.tabs button.active{background:var(--p);color:#fff}.topic{border-left:4px solid var(--p);padding:14px 16px;background:#fff;margin:12px 0;border-radius:10px}.question{font-size:19px;font-weight:700;margin:20px 0}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:14px;border-radius:10px;margin:9px 0}.option:hover{border-color:var(--p)}.payment{display:grid;grid-template-columns:1fr 1fr;gap:20px}.small{font-size:12px;color:var(--muted)}footer{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:850px){.auth{grid-template-columns:1fr}.auth-left{display:none}aside{display:none}.stats{grid-template-columns:1fr 1fr}.form-grid,.payment{grid-template-columns:1fr}main{padding:18px}.hero h1{font-size:24px}}

.admin-login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#082f2b,#075e54);padding:20px}
.admin-card{width:min(520px,100%);background:#fff;border-radius:20px;padding:32px;box-shadow:0 20px 60px #0004}
.admin-shell{min-height:100vh;background:#f4f7f7}
.admin-top{height:68px;background:#14201e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5%}
.admin-layout{display:flex;min-height:calc(100vh - 68px)}
.admin-side{width:245px;background:#fff;border-right:1px solid var(--line);padding:20px 14px}
.admin-side button{width:100%;padding:12px 14px;margin-bottom:6px;border-radius:10px;background:transparent;text-align:left;color:#40514e}
.admin-side button.active,.admin-side button:hover{background:#e8f5f2;color:var(--p);font-weight:700}
.admin-main{flex:1;padding:28px;max-width:1400px}
.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.admin-table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
.admin-table th,.admin-table td{padding:13px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.admin-table th{background:#f0f5f3}
.admin-badge{padding:5px 8px;border-radius:15px;font-size:11px;font-weight:800}
.pending{background:#fff4cf;color:#866100}.approved{background:#e6f7ec;color:#176b38}.rejected{background:#ffe8e5;color:#a52b21}
.admin-section{display:none}.admin-section.active{display:block}
.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:850px){.admin-side{display:none}.admin-grid{grid-template-columns:1fr 1fr}.admin-main{padding:18px}.admin-table{display:block;overflow-x:auto;white-space:nowrap}}

</head>
<body>


<div id="adminLogin" class="admin-login hidden">
  <div class="admin-card">
    <div class="brand" style="color:#075e54">JAMB <span style="color:#c89200">100%</span> ADMIN</div>
    <h2>Administrator Login</h2>
    <p class="muted">Secure administration portal.</p>
    <form id="adminLoginForm">
      <div class="field"><label>Admin email</label><input id="adminEmail" type="email" required></div><br>
      <div class="field"><label>Password</label><input id="adminPassword" type="password" required></div><br>
      <button class="primary" style="width:100%">Login to Admin</button>
    </form>
    <div id="adminLoginMsg"></div>
    <p class="switch"><span class="link" onclick="showStudentLogin()">Back to Student Login</span></p>
    <p class="small">Production note: administrator credentials must be stored and verified server-side, never exposed in public JavaScript.</p>
  </div>
</div>

<div id="auth" class="auth">
  <div class="auth-left">
    <div class="brand">JAMB <span>100%</span></div>
    <h1>Prepare. Practice. Improve.</h1>
    <p>A complete preparation portal for JAMB, NDA and POLAC candidates. Learn topics, practise CBT questions and track your progress.</p>
    <div class="grid">
      <div><b>Free</b><br>Learning</div><div><b>Free</b><br>CBT Practice</div><div><b>Paid</b><br>Mock Exams</div>
    </div>
  </div>
  <div class="auth-right">
    <div id="registerCard" class="auth-card">
      <h2>Create your account</h2><p class="muted">Register to save your progress and results.</p>
      <form id="registerForm">
        <div class="form-grid">
          <div class="field full"><label>Full name</label><input id="rname" required placeholder="Enter your full name"></div>
          <div class="field"><label>Email address</label><input id="remail" type="email" required placeholder="you@example.com"></div>
          <div class="field"><label>Phone number</label><input id="rphone" required placeholder="080..."></div>
          <div class="field"><label>Password</label><input id="rpass" type="password" minlength="6" required></div>
          <div class="field"><label>Confirm password</label><input id="rcpass" type="password" minlength="6" required></div>
          <div class="field full"><label>Preparation goal</label><select id="rgoal"><option>JAMB</option><option>NDA</option><option>POLAC</option><option>JAMB + NDA</option><option>JAMB + POLAC</option></select></div>
        </div>
        <br><button class="primary" style="width:100%">Create Account</button>
      </form>
      <div id="regMsg"></div>
      <div class="switch">Already registered? <span class="link" onclick="showLogin()">Login</span></div><div class="switch"><span class="link" onclick="showAdminLogin()">Administrator Login</span></div>
    </div>
    <div id="loginCard" class="auth-card hidden">
      <h2>Welcome back</h2><p class="muted">Login to continue your preparation.</p>
      <form id="loginForm"><div class="field"><label>Email</label><input id="lemail" type="email" required></div><br><div class="field"><label>Password</label><input id="lpass" type="password" required></div><br><button class="primary" style="width:100%">Login</button></form>
      <div id="loginMsg"></div><div class="switch">New student? <span class="link" onclick="showRegister()">Create account</span></div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
<header class="top"><div class="brand">JAMB <span>100%</span></div><div class="user"><span id="topName"></span><div class="avatar" id="avatar">M</div></div></header>
<div class="layout">
<aside><div class="nav">
<button class="active" data-section="dashboard">Dashboard</button>
<button data-section="learning">Learning</button>
<button data-section="cbt">JAMB CBT</button>
<button data-section="nda">NDA Preparation</button>
<button data-section="polac">POLAC Preparation</button>
<button data-section="mocks">Mock Exams</button>
<button data-section="compendium">Compendium</button>
<button data-section="payments">Payments</button>
<button data-section="profile">My Profile</button>
<button onclick="logout()">Logout</button>
</div></aside>
<main>
<section id="dashboard" class="section active">
<div class="hero"><div><h1>Welcome, <span id="hello"></span></h1><p>Continue your preparation from where you stopped.</p></div><div class="mark">100%</div></div>
<div class="stats"><div class="stat"><span class="muted">CBT Attempts</span><br><b id="attempts">0</b></div><div class="stat"><span class="muted">Learning Topics</span><br><b id="topicsDone">0</b></div><div class="stat"><span class="muted">Mock Access</span><br><b id="mockCount">0</b></div><div class="stat"><span class="muted">Overall Progress</span><br><b id="progress">0%</b></div></div>
<h2 style="margin-top:30px">Free Preparation</h2><div class="grid">
<div class="card"><span class="tag">FREE</span><h3>Learning</h3><p class="muted">Study difficult topics with explanations and examples.</p><button class="primary" onclick="go('learning')">Start Learning</button></div>
<div class="card"><span class="tag">FREE</span><h3>JAMB CBT</h3><p class="muted">Practise English, Mathematics, Physics and Chemistry.</p><button class="primary" onclick="go('cbt')">Start CBT</button></div>
<div class="card"><span class="tag">FREE</span><h3>NDA Preparation</h3><p class="muted">Study NDA subjects and preparation materials.</p><button class="primary" onclick="go('nda')">Open NDA</button></div>
<div class="card"><span class="tag">FREE</span><h3>POLAC Preparation</h3><p class="muted">Practise and revise POLAC-related subjects.</p><button class="primary" onclick="go('polac')">Open POLAC</button></div>
</div>
<h2 style="margin-top:30px">Paid Preparation</h2>
<div class="grid">
<div class="card"><span class="tag">₦1,500</span><h3>JAMB Mock</h3><p class="muted">Timed mock examination with results.</p><button class="primary" onclick="go('mocks')">Open Mock Exams</button></div>
<div class="card"><span class="tag">₦1,500</span><h3>NDA Mock</h3><p class="muted">NDA preparation mock examination.</p><button class="primary" onclick="go('mocks')">Open Mock Exams</button></div>
<div class="card"><span class="tag">₦1,500</span><h3>POLAC Mock</h3><p class="muted">POLAC preparation mock examination.</p><button class="primary" onclick="go('mocks')">Open Mock Exams</button></div>
<div class="card"><span class="tag">₦1,500</span><h3>Compendium</h3><p class="muted">Comprehensive study resource with in-app reading.</p><button class="primary" onclick="go('compendium')">Open Compendium</button></div>
</div></section>

<section id="learning" class="section"><h2>JAMB Learning Centre</h2><p class="muted">Complete topic-by-topic learning for Use of English, Mathematics, Physics and Chemistry. Each topic contains an explanation, method and worked example.</p><div class="notice"><b>JAMB syllabus learning:</b> Topic-by-topic coverage is organised by subject below.</div><div class="tabs" id="subjectTabs"></div><div class="tabs" id="learnTabs"></div><div id="lesson"></div></section>

<section id="cbt" class="section"><h2>JAMB CBT Practice</h2><p class="muted">Free practice. Choose any approved UTME subject, then start a 40-question session.</p><div class="tabs"><button onclick="startCBT('Agriculture')">Agriculture</button><button onclick="startCBT('Arabic')">Arabic</button><button onclick="startCBT('Art (Fine Art)')">Art (Fine Art)</button><button onclick="startCBT('Biology')">Biology</button><button onclick="startCBT('Chemistry')">Chemistry</button><button onclick="startCBT('Christian Religious Studies')">Christian Religious Studies</button><button onclick="startCBT('Commerce')">Commerce</button><button onclick="startCBT('Computer Studies')">Computer Studies</button><button onclick="startCBT('Economics')">Economics</button><button onclick="startCBT('French')">French</button><button onclick="startCBT('Geography')">Geography</button><button onclick="startCBT('Government')">Government</button><button onclick="startCBT('Hausa')">Hausa</button><button onclick="startCBT('History')">History</button><button onclick="startCBT('Home Economics')">Home Economics</button><button onclick="startCBT('Igbo')">Igbo</button><button onclick="startCBT('Islamic Studies')">Islamic Studies</button><button onclick="startCBT('Literature-in-English')">Literature-in-English</button><button onclick="startCBT('Mathematics')">Mathematics</button><button onclick="startCBT('Music')">Music</button><button onclick="startCBT('Physical and Health Education')">Physical and Health Education</button><button onclick="startCBT('Physics')">Physics</button><button onclick="startCBT('Principles of Accounts')">Principles of Accounts</button><button onclick="startCBT('Use of English')">Use of English</button><button onclick="startCBT('Yoruba')">Yoruba</button></div><div id="cbtArea"></div></section>

<section id="nda" class="section"><h2>NDA Preparation</h2><div class="grid">
<div class="card"><h3>Requirements</h3><p>Review current admission requirements and subject combinations before applying.</p></div><div class="card"><h3>Mathematics</h3><p>Topic notes, formulas and practice.</p></div><div class="card"><h3>English</h3><p>Grammar, vocabulary and comprehension practice.</p></div><div class="card"><h3>Physics</h3><p>Mechanics, electricity and other core topics.</p></div><div class="card"><h3>Chemistry</h3><p>Organic, inorganic and physical chemistry.</p></div><div class="card"><h3>General Knowledge</h3><p>Revision area for general knowledge practice.</p></div>
</div></section>

<section id="polac" class="section"><h2>POLAC Preparation</h2><div class="grid">
<div class="card"><h3>English</h3><p>Grammar, vocabulary and comprehension.</p></div><div class="card"><h3>Mathematics</h3><p>Core calculations and problem solving.</p></div><div class="card"><h3>General Knowledge</h3><p>Structured revision materials.</p></div><div class="card"><h3>Current Affairs</h3><p>Revision area for current-affairs preparation.</p></div><div class="card"><h3>Logical Reasoning</h3><p>Patterns, sequences and reasoning practice.</p></div>
</div></section>

<section id="mocks" class="section">
<h2>Mock Examinations</h2>
<p class="muted">The JAMB Mock is one paid product. After approval, choose any of the 25 UTME subjects below for a subject mock.</p>
<div class="grid">
<div class="card"><span class="tag">₦1,500</span><h3>JAMB Mock</h3>
<p>Unlock once, then practise any approved UTME subject.</p>
<button class="primary" onclick="buy('JAMB Mock')">Purchase / Request Access</button></div>
<div class="card"><span class="tag">₦1,500</span><h3>NDA Mock</h3><p>Timed NDA-style preparation mock and performance report.</p><button class="primary" onclick="buy('NDA Mock')">Purchase</button></div>
<div class="card"><span class="tag">₦1,500</span><h3>POLAC Mock</h3><p>Timed POLAC-style preparation mock and performance report.</p><button class="primary" onclick="buy('POLAC Mock')">Purchase</button></div>
</div>
<div class="card" style="margin-top:16px">
<h3>JAMB Mock Subjects — 25 Subjects</h3>
<p class="small">After JAMB Mock access is approved, select any subject below.</p>
<div class="tabs"><button onclick="startJAMBMock('Agriculture')">Agriculture</button><button onclick="startJAMBMock('Arabic')">Arabic</button><button onclick="startJAMBMock('Art (Fine Art)')">Art (Fine Art)</button><button onclick="startJAMBMock('Biology')">Biology</button><button onclick="startJAMBMock('Chemistry')">Chemistry</button><button onclick="startJAMBMock('Christian Religious Studies')">Christian Religious Studies</button><button onclick="startJAMBMock('Commerce')">Commerce</button><button onclick="startJAMBMock('Computer Studies')">Computer Studies</button><button onclick="startJAMBMock('Economics')">Economics</button><button onclick="startJAMBMock('French')">French</button><button onclick="startJAMBMock('Geography')">Geography</button><button onclick="startJAMBMock('Government')">Government</button><button onclick="startJAMBMock('Hausa')">Hausa</button><button onclick="startJAMBMock('History')">History</button><button onclick="startJAMBMock('Home Economics')">Home Economics</button><button onclick="startJAMBMock('Igbo')">Igbo</button><button onclick="startJAMBMock('Islamic Studies')">Islamic Studies</button><button onclick="startJAMBMock('Literature-in-English')">Literature-in-English</button><button onclick="startJAMBMock('Mathematics')">Mathematics</button><button onclick="startJAMBMock('Music')">Music</button><button onclick="startJAMBMock('Physical and Health Education')">Physical and Health Education</button><button onclick="startJAMBMock('Physics')">Physics</button><button onclick="startJAMBMock('Principles of Accounts')">Principles of Accounts</button><button onclick="startJAMBMock('Use of English')">Use of English</button><button onclick="startJAMBMock('Yoruba')">Yoruba</button></div>
<div id="mockArea"></div>
</div>
</section>

<section id="compendium" class="section"><h2>JAMB 100% Compendium</h2><div class="card"><span class="tag">₦1,500</span><h3>Comprehensive Study Compendium</h3><p>A large structured study resource covering JAMB, NDA and POLAC preparation, topic explanations, formulas, worked examples, practice questions and revision summaries.</p><button class="primary" onclick="buy('Compendium')">Purchase & Unlock</button><hr><h3>Reader features</h3><p class="muted">After approval: table of contents, search, bookmarks and “continue reading” progress.</p></div></section>

<section id="payments" class="section"><h2>Payment & Access</h2>
<div class="payment">
<div class="card"><h3>Payment Details</h3>
<p><b>Account name:</b> Mustapha Kabir</p><p><b>Provider:</b> OPay</p><p><b>Account:</b> 07034464609</p><p><b>Amount:</b> ₦1,500</p>
<div class="notice"><b>Important:</b> Your registered email is automatically attached to your payment request. The admin will use your email to approve only the product you paid for.</div>
<br><button class="primary" onclick="sendWhatsApp()">Send Screenshot on WhatsApp</button>
</div>
<div class="card"><h3>Submit Payment</h3>
<p class="muted">Logged in as: <b id="paymentEmail"></b></p>
<form id="payForm">
<div class="field"><label>Your registered email</label><input id="payEmail" readonly></div><br>
<div class="field"><label>What did you pay for?</label><select id="product"><option>JAMB Mock</option><option>NDA Mock</option><option>POLAC Mock</option><option>Compendium</option></select></div><br>
<div class="field"><label>Transaction/reference note</label><input id="ref" placeholder="Optional transaction reference"></div><br>
<div class="field"><label>Payment screenshot</label><input id="shot" type="file" accept="image/*" required></div><br>
<button class="primary">Submit for Admin Verification</button>
</form><div id="payMsg"></div></div></div></section>

<section id="profile" class="section"><h2>My Profile</h2><div class="card"><div class="form-grid"><div class="field"><label>Full name</label><input id="pname"></div><div class="field"><label>Email</label><input id="pemail" readonly></div><div class="field"><label>Phone</label><input id="pphone"></div><div class="field"><label>Goal</label><select id="pgoal"><option>JAMB</option><option>NDA</option><option>POLAC</option><option>JAMB + NDA</option><option>JAMB + POLAC</option></select></div></div><br><button class="primary" onclick="saveProfile()">Save Changes</button><div id="profileMsg"></div></div></section>
</main></div>
<footer>JAMB 100% • Student Preparation Portal</footer>
</div>


<div id="adminApp" class="admin-shell hidden">
<header class="admin-top"><div><b>JAMB 100% ADMIN</b><span class="small" style="color:#b8cbc7"> &nbsp;Control Panel</span></div><button class="secondary" onclick="adminLogout()">Logout</button></header>
<div class="admin-layout">
<aside class="admin-side">
<button class="active" data-admin="adminDashboard">Dashboard</button>
<button data-admin="adminStudents">Students</button>
<button data-admin="adminPayments">Payments</button>
<button data-admin="adminProducts">Product Access</button>
<button data-admin="adminQuestions">Question Bank</button>
<button data-admin="adminLearning">Learning Content</button>
<button data-admin="adminCompendium">Compendium</button>
<button data-admin="adminAnnouncements">Announcements</button>
</aside>
<main class="admin-main">

<section id="adminDashboard" class="admin-section active">
<h2>Admin Dashboard</h2><p class="muted">Monitor the JAMB 100% platform.</p>
<div class="admin-grid">
<div class="stat"><span class="muted">Registered Students</span><br><b id="aStudents">0</b></div>
<div class="stat"><span class="muted">Pending Payments</span><br><b id="aPending">0</b></div>
<div class="stat"><span class="muted">Approved Access</span><br><b id="aApproved">0</b></div>
<div class="stat"><span class="muted">Questions</span><br><b id="aQuestions">0</b></div>
</div>
<div class="grid">
<div class="card"><h3>Free Sections</h3><p>Learning • JAMB CBT • NDA • POLAC</p></div>
<div class="card"><h3>Paid Products</h3><p>JAMB Mock • NDA Mock • POLAC Mock • Compendium</p></div>
<div class="card"><h3>Payment workflow</h3><p>Review payment evidence, then unlock only the selected product.</p></div>
</div>
</section>

<section id="adminStudents" class="admin-section">
<h2>Student Management</h2><p class="muted">View registered accounts and preparation goals.</p>
<div class="card"><table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Goal</th><th>CBT</th><th>Topics</th><th>Products</th></tr></thead><tbody id="studentRows"></tbody></table></div>
</section>

<section id="adminPayments" class="admin-section">
<h2>Payment Verification</h2>
<p class="muted">Search the student's registered email, confirm the product they paid for, then approve only that product.</p>
<div class="card" style="margin-bottom:16px">

if(btn){document.querySelectorAll('#subjectTabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
const ids=topics.map((t,i)=>t[0]===subject?i:-1).filter(i=>i>=0);
learnTabs.innerHTML=ids.map(i=>`<button onclick="lesson(${i})">${topics[i][1]}</button>`).join("");
if(ids.length) lesson(ids[0]);
}

function completeTopic(i){if(!current.topics.includes(i)){current.topics.push(i);users=users.map(u=>u.id===current.id?current:u);save();render()}alert("Topic marked complete.")}
